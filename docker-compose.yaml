services:
  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend_net
    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    expose:
      - "8090"
    volumes:
      - ./backend:/testy
      - /var/run/docker.sock:/var/run/docker.sock
      - submissions:/submissions
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - postgres

  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
        target: prod
      expose:
        - "3000"
      restart: unless-stopped
      networks:
        - frontend_net

  postgres:
    image: postgres:17-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: testy
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true # Disallows external/internet traffic to/from Postgres entirely

volumes:
  pgdata:
  submissions:
    name: testy_submissions
  caddy_data:
  caddy_config:
