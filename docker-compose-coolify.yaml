services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    environment:
      PORT: 8090
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-dev}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      DB_NAME: ${POSTGRES_DB:-testy}
    expose:
      - "8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - submissions:/submissions
    networks:
      - app
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    environment:
      PORT: 3000
      INTERNAL_BACKEND_URL: http://backend:8090
    ports:
      - "3010:3000"
    networks:
      - app
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-testy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  pgdata:
  submissions:
    name: testy_submissions
